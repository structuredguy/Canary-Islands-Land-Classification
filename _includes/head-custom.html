<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  .markdown-body { font-size: 16px; line-height: 1.6; }
  .markdown-body img, .markdown-body svg { max-width: 100%; height: auto; display: block; margin: 1rem auto; }
  .markdown-body table { display: block; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .side-jump {
    background: #f0f7ff;
    border-left: 4px solid #2563eb;
    padding: 0.65rem 0.9rem;
    margin: 1rem 0;
    border-radius: 4px;
  }
</style>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
